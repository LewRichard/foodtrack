# Render Blueprint: https://render.com/docs/blueprint-spec
# In Render: New → Blueprint → pick this repository. You'll be asked for the secret values below.
services:
  - type: web
    name: foodtrack
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      # Only signed-in users can scan (needs the Supabase settings below). Set to "false" to allow everyone.
      - key: REQUIRE_SIGN_IN
        value: "true"
      # Optional shared code that also unlocks scanning without an account. Signed-in users never need it.
      - key: APP_ACCESS_CODE
        sync: false
      # Accounts & cloud backup (optional). From Supabase: Project Settings → API / API Keys.
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # Meal reminders (optional, see docs/REMINDERS.md)
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: SCANS_PER_IP_PER_HOUR
        value: "30"
      - key: DAILY_SCAN_LIMIT
        value: "300"
      # Free plan: AI meal logs (photo or description) per person per day. Needs SUPABASE_SERVICE_ROLE_KEY
      # and supabase/premium.sql; without them nothing is limited. See docs/PREMIUM.md.
      - key: FREE_SCANS_PER_DAY
        value: "5"
      # Model for photo and text logging (empty = claude-opus-5-5), e.g. claude-haiku-5-5 to cut cost.
      # Compare first with scripts/compare-models.ts (docs/AI_MODELS.md).
      - key: SCAN_MODEL
        sync: false
      # Selling Premium with Paddle (see docs/PADDLE.md). Leave empty until Paddle has approved you.
      - key: PADDLE_CLIENT_TOKEN
        sync: false
      - key: PADDLE_PRICE_MONTHLY
        sync: false
      - key: PADDLE_PRICE_YEARLY
        sync: false
      - key: PADDLE_WEBHOOK_SECRET
        sync: false
      - key: PADDLE_API_KEY
        sync: false
